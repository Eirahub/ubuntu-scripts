# Standardinnstillinger for alle brukere på laptopene (dconf keyfile-format).
# Nøkler som også står i gnome-laast.txt kan ikke endres av brukerne.
# Endre her og push, så får alle laptopene det ved neste kjøring.

# Skjermen slås aldri av, ingen dvale på strøm. På batteri går maskinen i dvale etter Zorins vanlige tid.
[org/gnome/desktop/session]
idle-delay=uint32 0

[org/gnome/settings-daemon/plugins/power]
sleep-inactive-ac-type='nothing'

# Ingen låseskjerm, så ingen låser seg ute
[org/gnome/desktop/screensaver]
lock-enabled=false
ubuntu-lock-on-suspend=false

[org/gnome/desktop/lockdown]
disable-lock-screen=true

# Bakgrunnsbilde med laptopnavnet (lages av systeminnstillinger-modulen)
[org/gnome/desktop/background]
picture-uri='file:///usr/share/backgrounds/ubuntu-scripts.svg'
picture-uri-dark='file:///usr/share/backgrounds/ubuntu-scripts.svg'
picture-options='zoom'

# Norsk tastatur, 24-timers klokke
[org/gnome/desktop/input-sources]
sources=[('xkb', 'no')]

[org/gnome/desktop/interface]
clock-format='24h'

# Ingen oppdateringsvarsler eller feilrapporter (sikkerhetsoppdateringer installeres i bakgrunnen)
[org/gnome/software]
download-updates=false
download-updates-notify=false
allow-updates=false
first-run=false

[com/ubuntu/update-notifier]
no-show-notifications=true

[org/gnome/desktop/privacy]
report-technical-problems=false
send-software-usage-stats=false
